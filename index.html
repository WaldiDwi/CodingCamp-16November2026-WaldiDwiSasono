<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1 id="site-title">To Do++</h1>
    <button id="theme-toggle" aria-label="Toggle theme">☀ / ☽</button>
  </header>

  <main class="dashboard-grid">

    <!-- Widget 1 -->
    <section id="greeting-widget" class="widget">
      <div id="greeting-text"></div>
      <div id="greeting-name"></div>
      <div id="datetime-display"></div>
      <div class="greeting-name-form">
        <input id="name-input" type="text" placeholder="Enter your name">
        <button id="name-save-btn">Save</button>
      </div>
    </section>

    <!-- Widget 2 -->
    <section id="timer-widget" class="widget">
      <div class="timer-mode-tabs">
        <button class="mode-tab active" data-mode="pomodoro" data-minutes="25">Pomodoro</button>
        <button class="mode-tab" data-mode="short" data-minutes="5">Short Break</button>
        <button class="mode-tab" data-mode="long" data-minutes="15">Long Break</button>
      </div>
      <div id="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="timer-start">Start</button>
        <button id="timer-stop">Stop</button>
        <button id="timer-reset">Reset</button>
      </div>
      <input id="duration-input" type="number" min="1" max="60" value="25">
      <button id="duration-save-btn">Set</button>
    </section>

    <!-- Widget 3 -->
    <section id="todo-widget" class="widget">
      <h2 class="widget-title-orange">Your To Do List</h2>
      <input id="task-input" type="text" placeholder="New task...">
      <button id="task-add-btn">Add</button>
      <p id="task-error" class="error-msg" hidden></p>
      <ul id="task-list"></ul>
    </section>

    <!-- Widget 4 -->
    <section id="links-widget" class="widget">
      <div class="preset-links">
        <a class="preset-link" href="https://www.google.com" target="_blank" rel="noopener">
          <!-- Google "G" logo -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5a4.7 4.7 0 0 1-2 3.1v2.5h3.3c1.9-1.8 3-4.4 3-7.4z" fill="#fff" opacity=".9"/>
            <path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#fff" opacity=".9"/>
            <path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1A10 10 0 0 0 2 12c0 1.6.4 3.2 1.1 4.6L6.4 14z" fill="#fff" opacity=".9"/>
            <path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9C16.9 2.9 14.6 2 12 2A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z" fill="#fff" opacity=".9"/>
          </svg>
          Google
        </a>
        <a class="preset-link" href="https://calendar.google.com" target="_blank" rel="noopener">
          <!-- Calendar icon -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/>
            <line x1="3" y1="9" x2="21" y2="9" stroke="#fff" stroke-width="1.8"/>
            <line x1="8" y1="2" x2="8" y2="6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="16" y1="2" x2="16" y2="6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="15" r="1.5" fill="#fff"/>
          </svg>
          Calendar
        </a>
        <a class="preset-link" href="https://mail.google.com" target="_blank" rel="noopener">
          <!-- Gmail envelope icon -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/>
            <polyline points="2,5 12,13 22,5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          Gmail
        </a>
      </div>
      <input id="link-label-input" type="text" placeholder="Label">
      <input id="link-url-input" type="url" placeholder="https://...">
      <button id="link-add-btn">Add</button>
      <p id="link-error" class="error-msg" hidden></p>
      <div id="links-container"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
